[workspace]
members = ["crates/core", "crates/cli", "crates/ui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/v0l/testbench"
description = "Test and measure bench: a PSU, an electronic load and a NanoVNA from one window"

[workspace.dependencies]
testbench-core = { path = "crates/core" }
cycler-core = { git = "https://github.com/v0l/cycler" }
antenna-vna = { git = "https://github.com/v0l/antenna-toolbox" }
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
